<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZTO100 Deal Intelligence</title>
<style>
:root{--nav:#182133;--bg:#f5f7fa;--card:#fff;--text:#152033;--muted:#718096;--border:#dde3ea;--green:#dcefe8;--blue:#dce9f6;--amber:#f6e7bd;--coral:#f3d9d4;--accent:#2d7b6d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:var(--nav);color:#fff;padding:18px 12px}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}.logo{width:38px;height:38px;border-radius:11px;background:#ffffff14;display:grid;place-items:center;font-weight:800}.brand small{display:block;color:#9fb0c7;letter-spacing:.12em;font-size:9px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aebbd0;padding:11px 12px;border-radius:10px;text-align:left;font-weight:650}.nav button.active,.nav button:hover{background:#394355;color:#fff}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 22px}.search{width:min(460px,100%);height:42px;border:1px solid var(--border);border-radius:10px;padding:0 13px}.primary{height:42px;border:0;border-radius:10px;padding:0 15px;background:#111a2d;color:#fff;font-weight:700}.content{max-width:1400px;margin:auto;padding:28px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#4e7f73;font-weight:800}.title{font-size:30px;margin:5px 0}.sub{color:var(--muted);font-size:14px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}.kpi{border-radius:17px;padding:18px;min-height:112px;border:1px solid #0001}.kpi b{display:block;font-size:27px;margin-top:10px}.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;opacity:.65}.green{background:var(--green)}.blue{background:var(--blue)}.amber{background:var(--amber)}.coral{background:var(--coral)}.section{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}.section h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.cases{display:grid;grid-template-columns:1fr 1fr;gap:16px}.case{border:1px solid var(--border);border-radius:18px;padding:20px;background:#fff;text-align:left}.case.unlimit{background:#f1f9f6;border-left:5px solid #2f7f70}.case.emd{background:#f2f6fb;border-left:5px solid #4e6fa8}.case.custom{background:#f7f4fb;border-left:5px solid #8b6bb3}.case h3{margin:0 0 5px}.meta{color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid #0001;margin-top:16px;padding-top:14px}.metrics b{font-size:18px}.metrics small{display:block;color:var(--muted);text-transform:uppercase;font-size:9px}.panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px}.actions{background:#fff7e9}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-top:1px solid #0001}.row:first-child{border-top:0}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:11px;border-bottom:1px solid var(--border);font-size:13px;text-align:left}th{font-size:10px;text-transform:uppercase;color:var(--muted);background:#fafbfc}.chip{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf1f5;font-size:11px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:18px 0}.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow:auto}.col{min-width:210px;background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:10px}.deal{margin-top:8px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px}.cards{display:grid;gap:10px}.work{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:12px}.modal{border:0;border-radius:18px;width:min(520px,92vw);padding:0}.modal::backdrop{background:#0007}.modalbody{padding:20px}.form{display:grid;gap:11px;margin-top:15px}.form input,.form select{width:100%;height:42px;border:1px solid var(--border);border-radius:9px;padding:0 10px}.form label{font-size:12px;font-weight:700}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 12px}.btn.save{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.cases{grid-template-columns:1fr}.app{display:block}.side{padding:10px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center}.brand{padding-bottom:10px}}
@media(max-width:620px){.top{height:auto;flex-direction:column;align-items:stretch}.search,.primary{width:100%}.nav{grid-template-columns:repeat(2,1fr)}.content{padding:16px}.title{font-size:25px}.kpis{grid-template-columns:repeat(2,1fr);gap:9px}.row,.work{display:block}.kanban{grid-template-columns:repeat(5,84vw)}.col{min-width:84vw}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">ZT</div><div><b>ZTO100</b><small>DEAL INTELLIGENCE</small></div></div><nav class="nav">
<button data-v="dashboard">Dashboard</button><button data-v="work">My Work</button><button data-v="cases">Cases</button><button data-v="investors">Investors</button><button data-v="pipeline">Pipeline</button><button data-v="candidates">Candidate Pool</button>
</nav></aside><main class="main"><header class="top"><input id="search" class="search" placeholder="Søg investorer, virksomheder, cases..."><button id="quick" class="primary">+ Quick actions</button></header><section class="content"><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><div class="sub" id="subtitle"></div><div id="view"></div></section></main></div>

<dialog id="quickModal" class="modal"><div class="modalbody"><h3>Quick actions</h3><div class="form"><button class="btn" data-open="caseModal">+ Ny case</button><button class="btn" data-open="investorModal">+ Ny investor</button><button class="btn" data-open="candidateModal">+ Ny kandidat</button></div><div class="modalactions"><button class="btn" data-close>Luk</button></div></div></dialog>
<dialog id="caseModal" class="modal"><form id="caseForm" class="modalbody"><h3>Ny case</h3><div class="form"><label>Case<input name="name" required></label><label>Virksomhed<input name="company"></label><label>Mål<input name="target" placeholder="fx 15 mio. kr."></label><label>Status<select name="status"><option>Active</option><option>Preparation</option></select></label></div><div class="modalactions"><button type="button" class="btn" data-close>Annuller</button><button class="btn save">Opret</button></div></form></dialog>
<dialog id="investorModal" class="modal"><form id="investorForm" class="modalbody"><h3>Ny investor</h3><div class="form"><label>Navn<input name="name" required></label><label>Virksomhed<input name="company"></label><label>Kapacitet<input name="capacity"></label><label>Status<select name="status"><option>Research</option><option>Qualified</option></select></label></div><div class="modalactions"><button type="button" class="btn" data-close>Annuller</button><button class="btn save">Opret</button></div></form></dialog>
<dialog id="candidateModal" class="modal"><form id="candidateForm" class="modalbody"><h3>Ny kandidat</h3><div class="form"><label>Navn<input name="name" required></label><label>Virksomhed<input name="company"></label></div><div class="modalactions"><button type="button" class="btn" data-close>Annuller</button><button class="btn save">Opret</button></div></form></dialog>

<script>
const seed={
cases:[{id:'CASE-001',slug:'unlimit',name:'Unlimit Group – Capital Raise',company:'Unlimit Group A/S',target:'15 mio. kr.',status:'Active'},{id:'CASE-002',slug:'emd',name:'EMD Service – Capital / Strategic Partner',company:'EMD Service A/S',target:'Ikke fastsat',status:'Preparation'}],
investors:[
['INV-001','Henrik Nicolai Hørdum Clausen','H4M / H&M investment','1–5 mio.','Research'],['INV-002','Hanssen familien / Hanssen koncernen','Hanssen koncernen','100+ mio.','Research'],['INV-003','Michael Andersen','','','Research'],['INV-004','Bent Møller','Møller Invest Aabenraa A/S','10–50 mio.','Qualified'],['INV-005','Hans Christian (HC) Freiberg','H.C.F. Holding, Tønder ApS','5–20 mio.','Research'],['INV-006','Michael Junker Christensen','','','Research'],['INV-007','Birktoft I/S / ejerkredsen','Birktoft ApS','2–10 mio.','Qualified'],['INV-008','Carsten Krag Hildebrandt','','1–5 mio.','Research'],['INV-009','Thomas Krag Burba','','1–5 mio.','Research'],['INV-010','Carl Johannes Krag','Krag Investment A/S','10–30 mio.','Research'],['INV-011','Jes Krag','','','Research'],['INV-012','Sune Hofsted','','0,5–3 mio.','Research'],['INV-013','Andreas Nielsen','Andreas Nielsen Holding Aabenraa ApS','2–10 mio.','Qualified'],['INV-014','Mikkel Ro Larsen','Tandlægeholdingselskabet ML ApS','5–15 mio.','Research'],['INV-015','Hoffmann familien / Hoffmann Esbjerg','Hoffmann Esbjerg Holding A/S','50–200+ mio.','Research'],['INV-016','Lasse Meldgaard','Meldgaard Holding A/S','10–50+ mio.','Research'],['INV-017','Henrik Meldgaard','Meldgaard Holding A/S','10–50+ mio.','Research'],['INV-018','Jesper Hansen','','','Research'],['INV-019','Michael Sangild','','','Research'],['INV-020','Ulrik Frederiksen','OSPA HOLDING ApS','5–20 mio.','Qualified'],['INV-021','Peter Maindal','MAINDAL HOLDING ApS','2–10 mio.','Qualified']
].map(x=>({id:x[0],name:x[1],company:x[2],capacity:x[3],status:x[4]})),
candidates:['Jesper Baungaard|Judica Advokaterne','Thomas Kaa|AK Byg','Ulrich Rasmussen|Tiny Hygge','Michael Anker|EY','Kaj Christian Glochau|Eget konsulenthus','Carsten Kjærgaard|Advokat & investor','Johnny Killerup|','Allan Sørensen|','Steffan RT|','Tom & Per Roth|','Frank Waller|','Jacob Kobeck|','Mark Ohl|','Jesper Sørensen|Nyit.dk / Softprojects','Laust Rich|Tecqan','Brian Jacobsen|Erhvervsfyrtårnet','Bjarne Hansen|','Maria Mølgaard|','Ruben Andersen|','John Heinze|','Asbjørn Jacobsen|Judica','Fleggaard familien|','Henrik Glise|ArbejdsmiljøEksperten','Niels Heuer|','Søren Behnfeld|','Karsten Færge|','Michael Noer|','Jesper Prior Larsen|','Peder Stein Burgaar|'].map((s,i)=>{let [name,company]=s.split('|');return{id:'CAN-'+(i+1),name,company,status:'Research'}}),
matches:[
{id:'M1',caseId:'CASE-001',investorId:'INV-004',status:'Contacted',priority:'A',fit:5,ticket:'10–20 mio.',next:'Følg op'},
{id:'M2',caseId:'CASE-001',investorId:'INV-020',status:'Meeting',priority:'A',fit:5,ticket:'5–10 mio.',next:'Forbered møde'},
{id:'M3',caseId:'CASE-001',investorId:'INV-021',status:'Not contacted',priority:'A',fit:4,ticket:'2–5 mio.',next:'Kontakt Peter'},
{id:'M4',caseId:'CASE-001',investorId:'INV-015',status:'Intro needed',priority:'A',fit:5,ticket:'20–50 mio.',next:'Planlæg intro'},
{id:'M5',caseId:'CASE-002',investorId:'INV-004',status:'Not contacted',priority:'A',fit:4,ticket:'5–10 mio.',next:'Vurder fit'},
{id:'M6',caseId:'CASE-002',investorId:'INV-020',status:'Not contacted',priority:'A',fit:4,ticket:'5–10 mio.',next:'Vurder interesse'},
{id:'M7',caseId:'CASE-002',investorId:'INV-016',status:'Intro needed',priority:'B',fit:4,ticket:'10–20 mio.',next:'Find introvej'}
]};
const KEY='zto100-v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||seed;let current='dashboard';let currentCase='CASE-001';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],save=()=>localStorage.setItem(KEY,JSON.stringify(state)),inv=id=>state.investors.find(x=>x.id===id),cas=id=>state.cases.find(x=>x.id===id);
function head(t,e,s){title.textContent=t;eyebrow.textContent=e;subtitle.textContent=s}
function nav(){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===current))}
function card(c){const ms=state.matches.filter(m=>m.caseId===c.id),css=c.slug==='unlimit'?'unlimit':c.slug==='emd'?'emd':'custom';return '<button class="case '+css+'" data-case="'+c.id+'"><h3>'+c.name+'</h3><div class="meta">'+(c.company||'')+'</div><div class="metrics"><div><b>'+ms.length+'</b><small>Investors</small></div><div><b>'+ms.filter(m=>m.status!=='Not contacted').length+'</b><small>Contacted+</small></div><div><b>'+c.target+'</b><small>Target</small></div></div></button>'}
function dashboard(){head('Dashboard','Executive overview','Hvad kræver din opmærksomhed nu.');view.innerHTML='<div class="kpis"><div class="kpi green"><span>Aktive cases</span><b>'+state.cases.length+'</b><div class="meta">Nuværende portefølje</div></div><div class="kpi blue"><span>Kvalificerede investorer</span><b>'+state.investors.filter(i=>i.status==='Qualified').length+'</b><div class="meta">Investor master</div></div><div class="kpi amber"><span>Nye kandidater</span><b>'+state.candidates.length+'</b><div class="meta">Candidate pool</div></div><div class="kpi coral"><span>Åbne handlinger</span><b>'+state.matches.filter(m=>m.next).length+'</b><div class="meta">Kræver opfølgning</div></div></div><div class="section"><h2>Aktive cases</h2></div><div class="cases">'+state.cases.map(card).join('')+'</div><div class="section"><h2>Næste handlinger</h2></div><div class="panel actions">'+state.matches.slice(0,5).map(m=>'<div class="row"><div><b>'+inv(m.investorId).name+'</b><div class="meta">'+cas(m.caseId).name+' · '+m.status+'</div></div><div>'+m.next+'</div></div>').join('')+'</div>'}
function cases(){head('Cases','Case portfolio','Hver case har sin egen investor-pipeline.');view.innerHTML='<div class="toolbar"><span class="meta">'+state.cases.length+' cases</span><button class="primary" data-open="caseModal">+ Ny case</button></div><div class="cases">'+state.cases.map(card).join('')+'</div>'}
function investors(q=''){head('Investors','Shared master','Én fælles investor-master på tværs af cases.');const rows=state.investors.filter(i=>(i.name+' '+i.company).toLowerCase().includes(q.toLowerCase()));view.innerHTML='<div class="toolbar"><span class="meta">'+rows.length+' investorer</span><button class="primary" data-open="investorModal">+ Ny investor</button></div><div class="tablewrap"><table><thead><tr><th>Investor</th><th>Virksomhed</th><th>Kapacitet</th><th>Status</th></tr></thead><tbody>'+rows.map(i=>'<tr><td><b>'+i.name+'</b></td><td>'+(i.company||'—')+'</td><td>'+(i.capacity||'—')+'</td><td><span class="chip">'+i.status+'</span></td></tr>').join('')+'</tbody></table></div>'}
function candidates(){head('Candidate Pool','Research inbox','Navne der skal kvalificeres før de bliver investorer.');view.innerHTML='<div class="toolbar"><span class="meta">'+state.candidates.length+' kandidater</span><button class="primary" data-open="candidateModal">+ Ny kandidat</button></div><div class="tablewrap"><table><thead><tr><th>Navn</th><th>Virksomhed</th><th>Status</th></tr></thead><tbody>'+state.candidates.map(c=>'<tr><td><b>'+c.name+'</b></td><td>'+(c.company||'—')+'</td><td><span class="chip">'+c.status+'</span></td></tr>').join('')+'</tbody></table></div>'}
function pipeline(id=currentCase){currentCase=id;const c=cas(id)||state.cases[0],statuses=['Not contacted','Intro needed','Contacted','Meeting','Dialogue'],data=state.matches.filter(m=>m.caseId===c.id);head('Pipeline','Case specific',c.name);view.innerHTML='<div class="toolbar"><select id="caseSel">'+state.cases.map(x=>'<option value="'+x.id+'" '+(x.id===c.id?'selected':'')+'>'+x.name+'</option>').join('')+'</select><button class="primary" id="addInvestor">+ Tilføj investor</button></div><div class="kanban">'+statuses.map(s=>'<div class="col"><b>'+s+'</b><span class="chip" style="float:right">'+data.filter(m=>m.status===s).length+'</span>'+data.filter(m=>m.status===s).map(m=>'<div class="deal"><b>'+inv(m.investorId).name+'</b><div class="meta">Fit '+m.fit+'/5 · '+m.ticket+'</div><div style="margin-top:8px">'+m.next+'</div></div>').join('')+'</div>').join('')+'</div>';caseSel.onchange=e=>pipeline(e.target.value);addInvestor.onclick=()=>{const name=prompt('Skriv investor-navn');if(!name)return;const i=state.investors.find(x=>x.name.toLowerCase().includes(name.toLowerCase()));if(!i){alert('Investor ikke fundet');return}if(state.matches.some(m=>m.caseId===c.id&&m.investorId===i.id)){alert('Allerede i casen');return}state.matches.push({id:'M'+Date.now(),caseId:c.id,investorId:i.id,status:'Not contacted',priority:'B',fit:3,ticket:'Ikke fastsat',next:'Definér næste handling'});save();pipeline(c.id)}}
function work(){head('My Work','Execution','Dine åbne handlinger.');view.innerHTML='<div class="cards">'+state.matches.filter(m=>m.next).map(m=>'<div class="work"><div><b>'+inv(m.investorId).name+'</b><div class="meta">'+cas(m.caseId).name+' · '+m.status+'</div></div><b>'+m.next+'</b></div>').join('')+'</div>'}
function render(){nav();if(current==='dashboard')dashboard();if(current==='cases')cases();if(current==='investors')investors(search.value);if(current==='candidates')candidates();if(current==='pipeline')pipeline();if(current==='work')work()}
$$('.nav button').forEach(b=>b.onclick=()=>{current=b.dataset.v;render()});quick.onclick=()=>quickModal.showModal();search.oninput=e=>{current='investors';investors(e.target.value);nav()};
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o)document.getElementById(o.dataset.open).showModal();const c=e.target.closest('[data-close]');if(c)c.closest('dialog').close();const cc=e.target.closest('[data-case]');if(cc){current='pipeline';pipeline(cc.dataset.case);nav()}});
caseForm.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.cases.push({id:'CASE-'+Date.now(),slug:'custom',name:f.get('name'),company:f.get('company'),target:f.get('target')||'Ikke fastsat',status:f.get('status')});save();caseModal.close();e.target.reset();current='cases';render()};
investorForm.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.investors.push({id:'INV-'+Date.now(),name:f.get('name'),company:f.get('company'),capacity:f.get('capacity'),status:f.get('status')});save();investorModal.close();e.target.reset();current='investors';render()};
candidateForm.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.candidates.unshift({id:'CAN-'+Date.now(),name:f.get('name'),company:f.get('company'),status:'Research'});save();candidateModal.close();e.target.reset();current='candidates';render()};
render();
</script></body></html>
